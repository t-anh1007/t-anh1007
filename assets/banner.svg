<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2b"/>
      <stop offset="1" stop-color="#10231d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .dash { stroke-dasharray: 6 10; animation: flow 3s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -64; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- left: identity -->
  <text x="64" y="92" fill="#f7e463" font-size="15" font-weight="700" letter-spacing="3">FULLSTACK ENGINEER · BUSINESS ANALYST</text>
  <text x="62" y="150" fill="#ffffff" font-size="54" font-weight="800">Nguyễn Tuấn Anh</text>
  <text x="64" y="192" fill="#c9d6e3" font-size="20">I build event-driven microservice products —</text>
  <text x="64" y="220" fill="#c9d6e3" font-size="20">from spec to production, with benchmarks to prove it.</text>
  <text x="64" y="268" fill="#2ce6a6" font-size="16" font-family="Consolas, 'JetBrains Mono', monospace">$ open ./courtin ./cab<tspan class="caret" fill="#2ce6a6">▌</tspan></text>

  <!-- right: mini architecture graph -->
  <g transform="translate(650,58)">
    <path class="dash" d="M70 52 C 170 52, 170 102, 230 102" stroke="#f7e463" stroke-width="2" fill="none"/>
    <path class="dash" d="M70 152 C 170 152, 170 102, 230 102" stroke="#2ce6a6" stroke-width="2" fill="none"/>
    <path class="dash" d="M300 102 L 370 60" stroke="#8fb3d9" stroke-width="2" fill="none"/>
    <path class="dash" d="M300 102 L 370 102" stroke="#8fb3d9" stroke-width="2" fill="none"/>
    <path class="dash" d="M300 102 L 370 144" stroke="#8fb3d9" stroke-width="2" fill="none"/>

    <rect x="-40" y="30" width="112" height="44" rx="10" fill="#17456b" stroke="#f7e463"/>
    <image x="-34" y="35" width="40" height="34" href="data:image/png;base64,"/>
    <text x="38" y="58" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Courtin</text>
    <rect x="-40" y="130" width="112" height="44" rx="10" fill="#14352b" stroke="#2ce6a6"/>
    <text x="16" y="158" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">🚕 CAB</text>

    <rect x="228" y="80" width="74" height="44" rx="10" fill="#1d2b3d" stroke="#8fb3d9"/>
    <text x="265" y="107" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Gateway</text>

    <g font-size="12" fill="#ffffff" font-weight="600">
      <circle class="pulse" cx="380" cy="60" r="6" fill="#ff6600"/><text x="394" y="64">RabbitMQ · Kafka</text>
      <circle class="pulse" cx="380" cy="102" r="6" fill="#4169e1" style="animation-delay:.6s"/><text x="394" y="106">PostgreSQL · Mongo</text>
      <circle class="pulse" cx="380" cy="144" r="6" fill="#dc382d" style="animation-delay:1.2s"/><text x="394" y="148">Redis · Socket.IO</text>
    </g>
  </g>
</svg>
